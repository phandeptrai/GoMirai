# =============================================================================
# Booking Service - Application Configuration (GoMirai Standard)
# =============================================================================
spring.application.name=ride-service
server.port=8088
spring.threads.virtual.enabled=true

# MongoDB Configuration
# Support both naming conventions:
# - SPRING_DATA_MONGODB_URI (Spring relaxed binding / Docker Compose)
# - BOOKING_MONGODB_URI (legacy env var used in some deployments)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${BOOKING_MONGODB_URI}}
spring.data.mongodb.database=booking_db
spring.data.mongodb.auto-index-creation=true

# CRITICAL: avoid UUID @Id read/write mismatches across pods
spring.data.mongodb.uuid-representation=java-legacy

# MongoDB Connection Pool (optimized for high concurrency)
# Increased to 800 for 1500 VUs pressure
spring.data.mongodb.max-connection-pool-size=400
# PERF FIX: min=10 (trước là 50) → tránh connection rush khi pod khởi động
# 50 min × 2 pods = 100 connections ngay lúc startup → MongoDB bị overloaded trước khi service ready
spring.data.mongodb.min-connection-pool-size=10
spring.data.mongodb.max-connection-idle-time=30000
spring.data.mongodb.max-connection-life-time=120000
# Driver timeouts — MongoConfig.java overrides these via MongoClientSettingsBuilderCustomizer
# serverSelection=30s (startup), socket/read=5s, pool maxWait=5s
spring.data.mongodb.connect-timeout=2000
spring.data.mongodb.socket-timeout=5000

# Consul - Service Discovery & Registration (chuẩn GoMirai)
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=30s
# Consul đánh dấu pod là CRITICAL nếu health check fail liên tiếp trong 90s
# → Increased from 30s to give services more time before being marked critical
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka Configuration (đúng chuẩn như UserService, AuthService)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# PERF: Tránh treo 30s-60s khi Kafka lag/mất kết nối
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=2000

spring.kafka.consumer.group-id=booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
# ⚠⚠ Tắt auto-commit → commit thủ công sau khi xử lý xong
# Phòng tránh duplicate message khi rebalance xảy ra lúc scale
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL
# Rebalance tuning: tành rebalance không cần thiết
spring.kafka.consumer.properties.session.timeout.ms=90000
# Consumer max.poll.interval: NOT the same as HTTP SLA — bounds time between polls (long jobs / pause).
spring.kafka.consumer.properties.max.poll.interval.ms=600000
spring.kafka.consumer.properties.heartbeat.interval.ms=20000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# SECURITY: Chỉ trust package của chính nó + common events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.ride.booking,com.gomirai.common.dto.event,com.gomirai.payment.events,com.gomirai.ride.pricing.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true

# Kafka Topics định nghĩa sẵn (dùng sau này)
kafka.topic.booking-created=booking-created-event
kafka.topic.booking-matched=booking-matched-event
kafka.topic.booking-started=booking-started-event
kafka.topic.booking-completed=booking-completed-event
kafka.topic.booking-canceled=booking-canceled-event
kafka.topic.booking-expired=booking-expired-event
kafka.topic.saga-compensation=saga-compensation-event
kafka.topic.booking-search-drivers=booking.search_drivers
kafka.topic.booking-assigned=booking.assigned
kafka.topic.driver-accepted=driver.accepted
kafka.topic.driver-declined=driver.declined
kafka.topic.booking-status-changed=booking.status.changed
kafka.topic.refund-requested=refund.requested

# CORS - Production: được set qua K8s ConfigMap CORS_ALLOWED_ORIGINS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type,X-Request-ID
cors.allow.credentials=true
cors.max.age=3600

# Actuator + Prometheus (SRE: p99 / max / resilience4j)
management.endpoints.web.exposure.include=health,prometheus,metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true

# JWT Secret - Chung toàn hệ thống
security.jwt.secret=${SECURITY_JWT_SECRET}

# Internal API Key - dùng cho giao tiếp nội bộ giữa các microservices
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}

# Logging - Muted to ERROR only for maximum performance during stress testing
logging.level.root=ERROR
logging.level.com.gomirai.ride.booking=ERROR
logging.level.org.springframework.data.mongodb.core.MongoTemplate=ERROR
logging.level.org.springframework.kafka=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web.filter.OncePerRequestFilter=ERROR

# Spring Boot optimizations
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false

# MVC async (WebAsyncTask / deferred) — must stay within gateway budget
spring.mvc.async.request-timeout=5000

# Server
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom Booking Service properties
booking.expiry-timeout-minutes=2
booking.max-retry-driver-match=3
booking.map-service.timeout=5000
booking.pricing-service.timeout=5000
booking.tracking-service.timeout=5000
booking.rest-template.timeout=5000
booking.map-service.connect-timeout=2000
booking.map-service.read-timeout=5000
booking.pricing-service.connect-timeout=2000
booking.pricing-service.read-timeout=5000
booking.tracking-service.connect-timeout=2000
booking.tracking-service.read-timeout=5000
booking.payment-service.connect-timeout=2000
booking.payment-service.read-timeout=5000
booking.driver-search-radius-meters=2000
# Radius for finding nearby bookings for driver (in kilometers)

# Apache HttpClient connection pool (replaces SimpleClientHttpRequestFactory which has NO pooling)
# PERF FIX: SimpleClientHttpRequestFactory mở TCP kết nối mới mỗi request → O(n) handshake overhead
# 500 VUs × 2 calls (map+pricing) = 1000 concurrent connections nếu không có pool
booking.http-client.max-total-connections=400
booking.http-client.max-connections-per-route=200
booking.http-client.connection-keep-alive-seconds=30
# Resilience4j — SLA: fail fast, no long retry chains (avoid 20–30s tails)
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=20
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=60
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.circuitbreaker.instances.mapService.base-config=default
resilience4j.circuitbreaker.instances.pricingService.base-config=default
resilience4j.circuitbreaker.instances.paymentService.base-config=default

# PERF FIX: Bulkhead 100 → 600 per instance, wait 0 → 200ms
# Khi 500 VUs hit riẽe-service (2 pods) = 250 concurrent/pod. 100 slot là quá nhỏ → hầu hết request bị reject ngay.
resilience4j.bulkhead.configs.default.max-concurrent-calls=600
resilience4j.bulkhead.configs.default.max-wait-duration=1000ms
resilience4j.bulkhead.instances.bookingCreate.base-config=default
resilience4j.bulkhead.instances.paymentWallet.base-config=default

# Retry: single retry max for outbound HTTP (map/pricing) — prevents 3× timeout stacks
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.enable-randomized-wait=true
resilience4j.retry.configs.default.randomized-wait-factor=0.5

resilience4j.retry.instances.mapService.max-attempts=2
resilience4j.retry.instances.pricingService.max-attempts=2

resilience4j.metrics.enabled=true

# Micrometer Tracing
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# Zipkin (Spring Boot 3.5+): management.zipkin.tracing.export.enabled. Env cũ MANAGEMENT_TRACING_EXPORT_ZIPKIN_* vẫn đọc được.
management.zipkin.tracing.export.enabled=${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED:false}}
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}}
management.tracing.export.zipkin.enabled=${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED:false}}

# Tomcat: bounded accept queue (fail fast under extreme load vs unbounded growth)
# PERF FIX: Tăng accept-count từ 200 lên 500 để không drop TCP connections ở OS level khi spike
server.tomcat.threads.max=1500
server.tomcat.accept-count=500

# Deep Health Checks
management.health.mongo.enabled=true
management.health.kafka.enabled=true
management.health.consul.enabled=true
management.endpoint.health.show-details=always

# ========================
# Redis Caching (For Map routes & Pricing)
# ========================
spring.data.redis.url=${SPRING_REDIS_URL:redis://redis:6379}
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
# IMPORTANT: Redis cache must be optional (avoid 500s when Redis is down/missing).
# - Production: set SPRING_CACHE_TYPE=redis
# - Local/dev: defaults to simple in-memory cache
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.cache.redis.time-to-live=3600000

# ========================
# Mapbox Token
# ========================
mapbox.api.token=${MAPBOX_ACCESS_TOKEN}
mapbox.api.base-url=https://api.mapbox.com

