# ==========================================
# 1. Service Identity
# ==========================================
spring.application.name=MapService
server.port=8086

# ==========================================
# 2. Consul Discovery Configuration
# ==========================================
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}

# ==========================================
# 3. Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=map-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ✅ SECURITY: Trusted Packages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.map,com.gomirai.common.dto.event

# ==========================================
# 4. Mapbox API Configuration
# ==========================================
mapbox.api.token=${MAPBOX_ACCESS_TOKEN}
mapbox.api.base-url=https://api.mapbox.com

# ==========================================
# 5. Security & JWT (from Common Lib)
# ==========================================
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-ttl-ms=3600000

# ==========================================
# 6. Actuator (Health Check)
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ==========================================
# 7. CORS Configuration
# ==========================================
cors.allowed.origins=http://localhost:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization
cors.allow.credentials=true
cors.max.age=3600

# ==========================================
# 8. Logging
# ==========================================
logging.level.com.gomirai.map=INFO
logging.level.com.gomirai.common=INFO
logging.level.org.springframework.security=INFO
