name: Enterprise Microservices CI/CD - GoMirai

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PROJECT_ID: gomirai-prod
  REGION: asia-southeast1
  REPO_NAME: gomirai-repo
  CLUSTER_NAME: gomirai-cluster
  CLUSTER_ZONE: asia-northeast1-a
  NS_STAGING: gomirai-staging
  NS_PROD: gomirai

jobs:
  # ==========================================
  # 1. CHANGE DETECTION
  # ==========================================
  changes:
    name: 🔍 Change Detection
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            auth-service: AuthService/**
            user-service: UserService/**
            payment-service: PaymentService/**
            driver-service: DriverService/**
            tracking-service: TrackingService/**
            map-service: MapService/**
            pricing-service: PricingService/**
            booking-service: BookingService/**
            review-service: ReviewService/**
            notification-service: NotificationService/**
            api-gateway: ApiGateway/**

  # ==========================================
  # 2. CI STAGE (FIXED)
  # ==========================================
  ci:
    name: 🧪 CI - Unit Tests (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: bitnami/kafka:3.7
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 1
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          ALLOW_PLAINTEXT_LISTENER: yes

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Install Common Library
        run: |
          cd gomirai-common-lib
          mvn install -DskipTests

      - name: Wait for Services
        run: sleep 20

      - name: Run Maven Test
        run: |
          SVC="${{ matrix.service }}"

          if [[ "$SVC" == "api-gateway" ]]; then
            FOLDER="ApiGateway"
          else
            FOLDER=$(echo "$SVC" | sed 's/-service//' | awk '{print toupper(substr($0,1,1))substr($0,2)}')Service
          fi

          echo "Testing in folder: $FOLDER"

          cd $FOLDER
          chmod +x mvnw
          ./mvnw clean test -Dspring.profiles.active=test

  # ==========================================
  # 3. STAGING DEPLOYMENT
  # ==========================================
  deploy-staging:
    name: 🏗️ Deploy Staging
    needs: [changes, ci]
    if: |
      needs.changes.outputs.services != '[]' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: google-github-actions/auth@v1
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Build & Push Docker
        run: |
          SVC="${{ matrix.service }}"
          [[ "$SVC" == "api-gateway" ]] && FOLDER="ApiGateway" || FOLDER=$(echo "$SVC" | sed 's/-service//' | awk '{print toupper(substr($0,1,1))substr($0,2)}')Service

          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service }}"

          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f $FOLDER/Dockerfile .
          docker push $IMAGE_PATH --all-tags

      - uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - run: |
          kubectl create namespace ${{ env.NS_STAGING }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/services/${{ matrix.service }}.yaml -n ${{ env.NS_STAGING }}

          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service }}"
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=$IMAGE_PATH:${{ github.sha }} \
            -n ${{ env.NS_STAGING }}

          kubectl rollout status deployment/${{ matrix.service }} \
            -n ${{ env.NS_STAGING }} --timeout=300s

  # ==========================================
  # 4. PERFORMANCE GATE
  # ==========================================
  performance-test:
    name: ⚡ k6 Perf Gate
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/k6/load-test.js
          flags: --env TARGET_URL=https://staging.gomirai.io

  # ==========================================
  # 5. PRODUCTION DEPLOYMENT
  # ==========================================
  deploy-production:
    name: 🌍 Deploy Production
    needs: [ci, performance-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: google-github-actions/auth@v1
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service }}"

          kubectl apply -f k8s/services/${{ matrix.service }}.yaml -n ${{ env.NS_PROD }}

          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=$IMAGE_PATH:${{ github.sha }} \
            -n ${{ env.NS_PROD }}

          kubectl rollout status deployment/${{ matrix.service }} \
            -n ${{ env.NS_PROD }} --timeout=300s
