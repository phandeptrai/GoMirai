name: GoMirai Safe Release Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  PROJECT_ID: gomirai-prod
  REGION: asia-southeast1
  REPO_NAME: gomirai-repo
  CLUSTER_NAME: gomirai-cluster
  CLUSTER_ZONE: asia-northeast1-a
  NAMESPACE: gomirai

jobs:
  # ==========================================
  # 1. CHANGE DETECTION
  # ==========================================
  changes:
    name: 🔍 Change Detection
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            auth-service: AuthService/**
            user-service: UserService/**
            payment-service: PaymentService/**
            driver-service: DriverService/**
            tracking-service: TrackingService/**
            pricing-service: PricingService/**
            ride-service: RideService/**
            booking-service: BookingService/**
            api-gateway: ApiGateway/**

  # ==========================================
  # 2. SAFE DEPLOY & VERIFY (Zero Downtime)
  # ==========================================
  deploy-and-verify:
    name: 🚀 Safe Release
    needs: [changes]
    if: needs.changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Authenticate to GCP'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Get GKE Credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.48.0/k6-v0.48.0-linux-amd64.tar.gz -L | tar -xz --strip-components 1
          sudo cp k6 /usr/local/bin/k6

      - name: Build & Push Docker
        run: |
          SVC="${{ matrix.service }}"
          FOLDER=$(echo "$SVC" | sed 's/-service//' | awk '{print toupper(substr($0,1,1))substr($0,2)}')Service
          [[ "$SVC" == "api-gateway" ]] && FOLDER="ApiGateway"
          
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service }}"
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f $FOLDER/Dockerfile .
          docker push $IMAGE_PATH --all-tags

      - name: Deploy Version 2
        run: |
          chmod +x ./k8s/scripts/deploy.sh
          ./k8s/scripts/deploy.sh

      - name: Run Verification & Gating
        run: |
          export BASE_URL="http://$(kubectl get svc nginx-service -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          chmod +x ./k8s/scripts/verify.sh
          ./k8s/scripts/verify.sh
