# =============================================================================
# Payment Service - Base Configuration
# =============================================================================

# Service identity
spring.application.name=PaymentService
server.port=8083

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=payment_db
spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool (optimized for MongoDB Atlas)
spring.data.mongodb.max-connection-pool-size=20
spring.data.mongodb.min-connection-pool-size=5
spring.data.mongodb.max-connection-idle-time=60000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=5000

# Consul discovery/health
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}:${random.uuid}
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.payment,com.gomirai.common.dto.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET}

# CORS
cors.allowed.origins=http://localhost:8080,http://api-gateway:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type,X-Request-ID
cors.allow.credentials=true
cors.max.age=3600

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Logging (optional defaults)
logging.level.com.gomirai.payment=DEBUG
logging.level.org.springframework.kafka=INFO
