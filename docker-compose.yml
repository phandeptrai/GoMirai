services:
  # MongoDB - Main Database for all microservices
  # Mirrors k8s/mongodb.yaml: replSet rs0 + Service DNS mongodb-service.gomirai.svc.cluster.local
  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      gomirai-network:
        aliases:
          - mongodb-service.gomirai.svc.cluster.local
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all &
        MONGOD_PID=$$!
        for i in $$(seq 1 90); do
          mongosh --host 127.0.0.1 --eval 'db.runCommand({ping:1})' --quiet 2>/dev/null && break
          if [ "$$i" -eq 90 ]; then exit 1; fi
          sleep 1
        done
        mongosh --host 127.0.0.1 --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb-service.gomirai.svc.cluster.local:27017"}]}) }' --quiet
        wait $$MONGOD_PID
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (rs.status().ok) quit(0); quit(1) } catch(e) { quit(1) }"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s

  # Consul - Service Discovery
  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    environment:
      CONSUL_LOG_LEVEL: warn
    networks:
      gomirai-network:
        aliases:
          - consul-service.gomirai.svc.cluster.local
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8500/v1/status/leader | grep -q '\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      gomirai-network:
        aliases:
          - zookeeper-service.gomirai.svc.cluster.local
    healthcheck:
      # This Confluent image may disable "ruok"; "srvr" is enabled by default.
      test: ["CMD", "sh", "-c", "echo srvr | nc -w 2 localhost 2181 | grep -qi 'zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-service.gomirai.svc.cluster.local:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service.gomirai.svc.cluster.local:29092,PLAINTEXT_HOST://kafka-service.gomirai.svc.cluster.local:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_CREATE_TOPICS: "notification.events:6:1,driver.booking.offer.batch:6:1,driver.location.update:6:1"
    networks:
      gomirai-network:
        aliases:
          - kafka-service.gomirai.svc.cluster.local
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - gomirai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul-service.gomirai.svc.cluster.local}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAVA_OPTS: "-Xms768m -Xmx768m -XX:+UseG1GC"
    networks:
      - gomirai-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Identity Service
  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${USER_MONGODB_URI:-mongodb://mongodb-service.gomirai.svc.cluster.local:27017/user_db?replicaSet=rs0}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul-service.gomirai.svc.cluster.local}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka-service.gomirai.svc.cluster.local:9092}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_OPTS: "-Xms768m -Xmx768m -XX:+UseG1GC"
    networks:
      - gomirai-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Driver Service
  driver-service:
    build:
      context: .
      dockerfile: DriverService/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${DRIVER_MONGODB_URI:-mongodb://mongodb-service.gomirai.svc.cluster.local:27017/driver_db?replicaSet=rs0}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul-service.gomirai.svc.cluster.local}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka-service.gomirai.svc.cluster.local:9092}
      JAVA_OPTS: "-Xms768m -Xmx768m -XX:+UseG1GC"
    networks:
      - gomirai-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Ride Service (merged Booking, Pricing, Map)
  ride-service:
    build:
      context: .
      dockerfile: RideService/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${BOOKING_MONGODB_URI:-mongodb://mongodb-service.gomirai.svc.cluster.local:27017/booking_db?replicaSet=rs0}
      PRICING_MONGODB_URI: ${PRICING_MONGODB_URI:-mongodb://mongodb-service.gomirai.svc.cluster.local:27017/pricing_db?replicaSet=rs0}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis.gomirai.svc.cluster.local}
      SPRING_REDIS_URL: ${SPRING_REDIS_URL:-redis://redis.gomirai.svc.cluster.local:6379}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul-service.gomirai.svc.cluster.local}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka-service.gomirai.svc.cluster.local:9092}
      SPRING_CACHE_TYPE: redis
      JAVA_OPTS: "-Xms1500m -Xmx1500m -XX:+UseG1GC"
    networks:
      - gomirai-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Communication Service (merged Notification, Review)
  communication-service:
    build:
      context: .
      dockerfile: CommunicationService/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${NOTIFICATION_MONGODB_URI:-mongodb://mongodb-service.gomirai.svc.cluster.local:27017/notification_db?replicaSet=rs0}
      REVIEW_MONGODB_URI: ${REVIEW_MONGODB_URI:-mongodb://mongodb-service.gomirai.svc.cluster.local:27017/review_db?replicaSet=rs0}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul-service.gomirai.svc.cluster.local}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka-service.gomirai.svc.cluster.local:9092}
      JAVA_OPTS: "-Xms768m -Xmx768m -XX:+UseG1GC"
    networks:
      - gomirai-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Tracking Service
  tracking-service:
    build:
      context: .
      dockerfile: TrackingService/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis.gomirai.svc.cluster.local}
      SPRING_REDIS_URL: ${SPRING_REDIS_URL:-redis://redis.gomirai.svc.cluster.local:6379}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul-service.gomirai.svc.cluster.local}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka-service.gomirai.svc.cluster.local:9092}
      JAVA_OPTS: "-Xms768m -Xmx768m -XX:+UseG1GC"
    networks:
      - gomirai-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      gomirai-network:
        aliases:
          - redis.gomirai.svc.cluster.local
          - redis-service.gomirai.svc.cluster.local
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gomirai-network:
    driver: bridge

volumes:
  mongo-data:
