services:
  # Consul - Service Discovery
  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    environment:
      # Reduce noisy deprecation warnings in terminal; options: trace|debug|info|warn|error
      CONSUL_LOG_LEVEL: warn
    networks:
      - gomirai-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - gomirai-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - gomirai-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .  # Build from root to access common-lib
      dockerfile: ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      consul:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    networks:
      - gomirai-network
    restart: on-failure

  # Auth Service
  auth-service:
    build:
      context: .  # Build from root to access common-lib
      dockerfile: AuthService/Dockerfile
    container_name: auth-service
    # ✅ SECURITY: Không expose port ra ngoài, chỉ giao tiếp internal qua API Gateway
    # ports:
    #   - "8081:8081"
    expose:
      - "8081"  # Chỉ expose trong internal network
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${AUTH_MONGODB_URI}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - gomirai-network
    restart: on-failure

  # User Service
  user-service:
    build:
      context: .  # Build from root to access common-lib
      dockerfile: UserService/Dockerfile
    container_name: user-service
    # ✅ SECURITY: Không expose port ra ngoài, chỉ giao tiếp internal qua API Gateway
    # ports:
    #   - "8082:8082"
    expose:
      - "8082"  # Chỉ expose trong internal network
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${USER_MONGODB_URI}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - gomirai-network
    restart: on-failure

  # Driver Service
  driver-service:
    build:
      context: .  # Build from root to access common-lib
      dockerfile: DriverService/Dockerfile
    container_name: driver-service
    expose:
      - "8084"
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: ${DRIVER_MONGODB_URI}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - gomirai-network
    restart: on-failure

  # Tracking Service
  tracking-service:
    build:
      context: .
      dockerfile: TrackingService/Dockerfile
    container_name: tracking-service
    ports:
      - "8085:8085"
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # ✅ Redis local is optional - can use cloud Redis via SPRING_REDIS_URL
      # Uncomment below if using local Redis:
      # redis:
      #   condition: service_healthy
    environment:
      # ✅ Using Redis Cloud URL
      SPRING_REDIS_URL: ${SPRING_REDIS_URL}
      
      # ✅ Option 2: Use local Redis (fallback if SPRING_REDIS_URL not set)
      # SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:redis}
      # SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:6379}
      # SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:}
      # SPRING_REDIS_USERNAME: ${SPRING_REDIS_USERNAME:}
      # SPRING_REDIS_SSL_ENABLED: ${SPRING_REDIS_SSL_ENABLED:false}
      
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - gomirai-network
    restart: on-failure

  # Map Service
  map-service:
    build:
      context: .  # Build from root to access common-lib
      dockerfile: MapService/Dockerfile
    container_name: map-service
    # ✅ SECURITY: Không expose port ra ngoài, chỉ giao tiếp internal qua API Gateway
    expose:
      - "8086"  # Chỉ expose trong internal network
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Mapbox API Token
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
      
      # Security
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      
      # Infrastructure
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - gomirai-network
    restart: on-failure

  # Redis - For Tracking Service (Local Development)
  # ✅ DISABLED - Using Redis Cloud instead
  # Uncomment below if you want to use local Redis container:
  # redis:
  #   image: redis:7.2-alpine
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - gomirai-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  gomirai-network:
    driver: bridge
