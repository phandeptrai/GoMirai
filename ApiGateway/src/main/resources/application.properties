spring.application.name=api-gateway
server.port=8080

spring.threads.virtual.enabled=true

# Consul Configuration
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-interval=30s
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

# Consul Config import (Spring Cloud)
spring.config.import=optional:consul:
spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.default-context=application
spring.cloud.consul.config.format=files
spring.cloud.consul.config.data-key=application.yml

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# JWT Security
security.jwt.secret=${SECURITY_JWT_SECRET}

# Internal API Key
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.mongo.enabled=true
management.health.kafka.enabled=true
management.health.consul.enabled=true

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type
cors.allow.credentials=true
cors.max.age=3600

# Logging
logging.level.com.gomirai.gateway=INFO
logging.level.com.gomirai.gateway.security=INFO

# Micrometer Tracing
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# --- PERF IMPROVEMENT #1: Virtual Thread Tomcat pool ---
# VTs are cheap — allow a large queue; OS threads are managed by JVM automatically
server.tomcat.threads.max=1200

# --- GATEWAY TIMEOUTS (Netty) ---
# Prevent 502s by giving backends consistent time to respond
spring.cloud.gateway.httpclient.response-timeout=20s
spring.cloud.gateway.httpclient.connect-timeout=10000

# --- PERF IMPROVEMENT #1: Resilience4j tuned for 24 vCPU e2-standard quota ---
# Faster detection: window=20 calls (was 10)
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
# 15 s open state: gives K8s time to restart crashed pods and pass health checks
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
# Treat calls >2 s as "slow" (was 3s) so CB trips BEFORE the 25 s spike observed in logs
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=60

# Retry: 2 attempts (was 3) with 500 ms base wait — avoids piling up VTs on retry storms
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2

# Kafka Reliability
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL
