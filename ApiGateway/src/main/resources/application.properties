spring.application.name=api-gateway
server.port=8080

spring.threads.virtual.enabled=false
spring.main.allow-bean-definition-overriding=true

# Debugging Startup (Reduced for performance)
logging.level.org.springframework.beans=WARN
logging.level.org.springframework.context=WARN

# Consul Configuration
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-interval=30s
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

# Consul Config import (Spring Cloud)
spring.config.import=optional:consul:
spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.default-context=application
spring.cloud.consul.config.format=files
spring.cloud.consul.config.data-key=application.yml

# Gateway Discovery Locator (Disabled to prioritize custom routes)
spring.cloud.gateway.discovery.locator.enabled=false

# Redis Configuration (Discovery Cache Layer)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# JWT Security
security.jwt.secret=${SECURITY_JWT_SECRET}

# Internal API Key
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}

# Actuator + Prometheus (SRE / SLA dashboards)
management.endpoints.web.exposure.include=health,prometheus,metrics
# OPTIMIZATION: Disable histograms at high load to prevent memory bloat (metris cardinality)
management.metrics.distribution.percentiles-histogram.http.server.requests=false
# ONLY collect metrics for standardized route IDs, not raw URIs
management.metrics.web.server.request.autotime.enabled=true
resilience4j.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.mongo.enabled=true
management.health.kafka.enabled=true
management.health.consul.enabled=true

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type
cors.allow.credentials=true
cors.max.age=3600

# Logging - Optimized for High Performance
logging.level.root=INFO
logging.level.com.gomirai.gateway=INFO
logging.level.org.springframework.cloud.gateway=WARN
logging.level.org.springframework.http.server.reactive=WARN
logging.level.org.springframework.web.reactive=WARN

# Micrometer Tracing - DISABLED for Stress Test to prevent memory buffering leaks
management.tracing.sampling.probability=0.0
management.tracing.enabled=false
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# Zipkin disabled by default to prevent buffer bloat if unreachable
management.zipkin.tracing.export.enabled=false
management.tracing.export.zipkin.enabled=false

# Virtual threads + bounded accept queue (fail fast vs unbounded SYN backlog)
# PERF FIX: Tăng accept-count để không drop connections ở OS level khi spike
# --- NETTY REACTIVE SERVER CONFIG ---
# Tuning for 1 vCPU environment (GKE nodes)
server.netty.connection-timeout=2s
server.netty.idle-timeout=15s

# --- GATEWAY SERVER WEBFLUX HTTP CLIENT ---
# Reduced max-connections to prevent per-pod memory bloat.
# With 5 pods, 500 connections each = 2500 total concurrent downstream slots.
spring.cloud.gateway.server.webflux.httpclient.pool.name=proxy-pool
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=500
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.pool.type=fixed
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

# --- LOADBALANCER CACHE (Caffeine) ---
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=30s
spring.cloud.loadbalancer.cache.capacity=1024

# Proxy logic timeouts
# Reduced to match HTTP client timeout and avoid overlapping timeouts
gateway.proxy.total-timeout-seconds=5
gateway.proxy.max-retries=0

# Resilience4j — proxy path (programmatic via GatewayDownstreamInvoker)
resilience4j.bulkhead.instances.gatewayDownstream.max-concurrent-calls=5000
resilience4j.bulkhead.instances.gatewayDownstream.max-wait-duration=200ms
resilience4j.circuitbreaker.instances.gatewayDownstream.sliding-window-size=100
resilience4j.circuitbreaker.instances.gatewayDownstream.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.gatewayDownstream.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.gatewayDownstream.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.gatewayDownstream.permitted-number-of-calls-in-half-open-state=10

# Kafka Reliability
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL
