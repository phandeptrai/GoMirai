spring.application.name=ApiGateway
server.port=8080

# Consul Configuration - Default for local, override by Docker env vars
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

# Consul Config import (Spring Cloud)
spring.config.import=optional:consul:
spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.default-context=application
spring.cloud.consul.config.format=files
spring.cloud.consul.config.data-key=application.yml

# Gateway Discovery Locator (routes can be augmented/overridden via Consul config)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# JWT Security - PHẢI GIỐNG AuthService và UserService

security.jwt.secret=${SECURITY_JWT_SECRET}

# Actuator endpoints - CHỈ expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# CORS Configuration - ApiGateway cho phép frontend (React, Angular, Vue)
cors.allowed.origins=http://localhost:3000,http://localhost:4200,http://localhost:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type
cors.allow.credentials=true
cors.max.age=3600

# Logging
logging.level.com.gomirai.gateway=INFO
logging.level.com.gomirai.gateway.security=DEBUG
