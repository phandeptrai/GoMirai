# ─────────────────────────────────────────────
# NOTIFICATION SERVICE (8090) — WebSocket support
# ─────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: gomirai
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 2
