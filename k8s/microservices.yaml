# =============================================================================
# GoMirai Microservices - Kubernetes Deployments, Services & HPAs
# Full manifest cho tất cả 11 microservices
# =============================================================================
# Services: Auth(8081) | User(8082) | Payment(8083) | Driver(8084) |
#           Tracking(8085) | Map(8086) | Pricing(8087) | Booking(8088) |
#           Review(8089) | Notification(8090)
# =============================================================================

# ─────────────────────────────────────────────
# AUTH SERVICE (8081)
# ─────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gomirai
  labels:
    app: auth-service
    version: "1.0"
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
        version: "1.0"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: asia-southeast1-docker.pkg.dev/gomirai-prod/gomirai-repo/auth-service:latest
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: gomirai-config
            - secretRef:
                name: gomirai-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gomirai
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: gomirai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70


