# =============================================================================
# GoMirai - Nginx Reverse Proxy + Ingress
# =============================================================================
# KIẾN TRÚC:
#   Internet → nginx-service (LoadBalancer GCP External IP)
#            → ApiGateway pod (ClusterIP, không expose ra ngoài)
#            → microservices (Consul discovery)
#
# ⚠️  LƯU Ý:
#   - Chỉ nginx-service mới là LoadBalancer (1 External IP)
#   - api-gateway-service là ClusterIP (nội bộ, chỉ nginx gọi)
#   - Không có double-hop không cần thiết
# =============================================================================

# ── Nginx ConfigMap ───────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: gomirai
data:
  nginx.conf: |
    worker_processes 2;
    events {
        worker_connections 4096;
        use epoll;
    }
    http {
        # ── Limits & Security ──────────────────────────────────────────────────
        client_max_body_size 10m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 65s;
        send_timeout 10s;

        # Ẩn version nginx khỏi header
        server_tokens off;

        # ── Upstream: ApiGateway ClusterIP ────────────────────────────────────
        # Trỏ đến K8s Service (ClusterIP), kube-proxy sẽ load balance
        # giữa các ApiGateway pods tự động
        upstream api_gateway {
            server api-gateway-service:8080;
            keepalive 32;
        }

        # ── HTTP Server ───────────────────────────────────────────────────────
        server {
            listen 80;
            server_name _;

            # Health check endpoint (cho GCP load balancer health check)
            location /nginx-health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # WebSocket (SockJS/STOMP) — SLA EXCLUSION: long-lived; not covered by REST SLA (≤10s class).
            location /ws/ {
                proxy_set_header X-Internal-Api-Key ""; # Security: Strip internal key from outside
                proxy_pass http://api_gateway;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            # Tất cả API requests
            location / {
                proxy_set_header X-Internal-Api-Key ""; # Security: Strip internal key from outside
                proxy_pass http://api_gateway;
                proxy_http_version 1.1;
                proxy_set_header Connection "";   # Enable keepalive
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # REST SLA: ingress hard cap (10s) — see docs/SLA-ARCHITECTURE.md & gateway.proxy.total-timeout-seconds
                proxy_connect_timeout 3s;
                proxy_read_timeout 10s;
                proxy_send_timeout 10s;

                # Buffer settings
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
            }
        }
    }


# ── Nginx Deployment ──────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: gomirai
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - nginx
            topologyKey: "kubernetes.io/hostname"
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "350m"
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "nginx -s quit; sleep 5"]
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config


# ── Nginx Service: LoadBalancer (Entry Point duy nhất từ Internet) ────────────
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: gomirai
  annotations:
    # GCP: giữ IP cố định (sau khi tạo reserve static IP trên GCP)
    # cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
