# Template — dùng k8s/create-secret.ps1 từ .env hoặc copy sang secrets.yaml (gitignored).

apiVersion: v1
kind: Secret
metadata:
  name: gomirai-secrets
  namespace: gomirai
type: Opaque
stringData:
  # ── JWT ──────────────────────────────────────────────────────────────────────
  # Key phải khớp với application.properties: ${SECURITY_JWT_SECRET}
  SECURITY_JWT_SECRET: "your-very-long-jwt-secret-at-least-256-bits"

  # Gateway ↔ services (ủy quyền JWT); trùng khóa với INTERNAL_API_KEY trong .env
  INTERNAL_API_KEY: "your-internal-api-key"

  # ── MongoDB Atlas — Per-Service URIs ─────────────────────────────────────────
  # Mỗi service có MongoDB user riêng, trên cùng 1 cluster Atlas
  # Database name được set trong application.properties: spring.data.mongodb.database
  AUTH_MONGODB_URI: "mongodb+srv://IdentityService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  USER_MONGODB_URI: "mongodb+srv://IdentityService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  DRIVER_MONGODB_URI: "mongodb+srv://DriverService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  PRICING_MONGODB_URI: "mongodb+srv://RideService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  PAYMENT_MONGODB_URI: "mongodb+srv://PaymentService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  BOOKING_MONGODB_URI: "mongodb+srv://RideService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  NOTIFICATION_MONGODB_URI: "mongodb+srv://CommunicationService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  REVIEW_MONGODB_URI: "mongodb+srv://CommunicationService:password@cluster.mongodb.net/?retryWrites=true&w=majority"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # In-cluster (redis từ infrastructure.yaml), không TLS — giống redis Docker local:
  #   SPRING_REDIS_URL: "redis://redis:6379"
  # Redis Cloud / có auth: redis://user:pass@host:6379  và SPRING_REDIS_SSL_ENABLED: "true" nếu nhà cung cấp bắt TLS
  SPRING_REDIS_URL: "redis://redis:6379"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_PASSWORD: ""
  SPRING_REDIS_USERNAME: ""
  SPRING_REDIS_SSL_ENABLED: "false"

  # ── Google OAuth ──────────────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"

  # ── VNPay ─────────────────────────────────────────────────────────────────────
  VNPAY_TMN_CODE: "your-tmn-code"
  VNPAY_HASH_SECRET: "your-hash-secret"
  VNPAY_RETURN_URL: "https://your-domain.com/payment/vnpay/result"
  VNPAY_PAYMENT_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"

  # ── Mapbox ───────────────────────────────────────────────────────────────────
  MAPBOX_ACCESS_TOKEN: "pk.your-mapbox-token"
