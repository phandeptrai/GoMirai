# =============================================================================
# GoMirai - Kubernetes Secrets (TEMPLATE)
# =============================================================================
# ⚠️  KHÔNG COMMIT FILE NÀY SAU KHI ĐIỀN GIÁ TRỊ THỰC!
# Thêm vào .gitignore: k8s/secrets.yaml
#
# Cách an toàn hơn: dùng lệnh kubectl trực tiếp:
#   kubectl create secret generic gomirai-secrets \
#     --from-literal=SECURITY_JWT_SECRET="xxx" \
#     --from-literal=SPRING_DATA_MONGODB_URI="mongodb+srv://..." \
#     -n gomirai
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: gomirai-secrets
  namespace: gomirai
type: Opaque
stringData:
  # ── JWT ──────────────────────────────────────────────────────────────────────
  # Key phải khớp với application.properties: ${SECURITY_JWT_SECRET}
  SECURITY_JWT_SECRET: "your-very-long-jwt-secret-at-least-256-bits"

  # ── MongoDB Atlas — Per-Service URIs ─────────────────────────────────────────
  # Mỗi service có MongoDB user riêng, trên cùng 1 cluster Atlas
  # Database name được set trong application.properties: spring.data.mongodb.database
  AUTH_MONGODB_URI: "mongodb+srv://AuthService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  USER_MONGODB_URI: "mongodb+srv://UserService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  DRIVER_MONGODB_URI: "mongodb+srv://DriverService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  PRICING_MONGODB_URI: "mongodb+srv://PricingService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  PAYMENT_MONGODB_URI: "mongodb+srv://PaymentService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  BOOKING_MONGODB_URI: "mongodb+srv://BookingService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  NOTIFICATION_MONGODB_URI: "mongodb+srv://NotificationService:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  REVIEW_MONGODB_URI: "mongodb+srv://ReviewService:password@cluster.mongodb.net/?retryWrites=true&w=majority"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  SPRING_REDIS_URL: "redis://:password@host:6379"
  SPRING_REDIS_HOST: "your-redis-host"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_PASSWORD: "your-redis-password"
  SPRING_REDIS_USERNAME: ""
  SPRING_REDIS_SSL_ENABLED: "true"

  # ── Google OAuth ──────────────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"

  # ── VNPay ─────────────────────────────────────────────────────────────────────
  VNPAY_TMN_CODE: "your-tmn-code"
  VNPAY_HASH_SECRET: "your-hash-secret"

  # ── Mapbox ───────────────────────────────────────────────────────────────────
  MAPBOX_ACCESS_TOKEN: "pk.your-mapbox-token"

  # ── VNPay Callback URLs (production) ─────────────────────────────────────────
  # ⚠️  THAY "your-domain.com" bằng domain thực
  VNPAY_RETURN_URL: "https://your-domain.com/payment/vnpay/result"
  VNPAY_PAYMENT_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
