apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  namespace: gomirai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ride-service
  template:
    metadata:
      labels:
        app: ride-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ride-service
          image: asia-southeast1-docker.pkg.dev/gomirai-prod/gomirai-repo/ride-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: gomirai-config
            - secretRef:
                name: gomirai-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xms768m -Xmx1200m -XX:+UseG1GC"
          resources:
            requests:
              memory: "1200Mi"
              cpu: "800m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ride-service
  namespace: gomirai
spec:
  selector:
    app: ride-service
  ports:
    - port: 8088
      targetPort: 8088
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ride-service-hpa
  namespace: gomirai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ride-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ride-service-pdb
  namespace: gomirai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ride-service
