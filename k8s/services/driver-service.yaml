apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: gomirai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: driver-service
          image: asia-southeast1-docker.pkg.dev/gomirai-prod/gomirai-repo/driver-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: gomirai-config
            - secretRef:
                name: gomirai-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "896Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: gomirai
spec:
  selector:
    app: driver-service
  ports:
    - port: 8082
      targetPort: 8084
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: driver-service-hpa
  namespace: gomirai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: driver-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: driver-service-pdb
  namespace: gomirai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: driver-service
