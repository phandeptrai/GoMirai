# ─────────────────────────────────────────────
# MAP SERVICE (8086)
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-service
  namespace: gomirai
  labels:
    app: map-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: map-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: map-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: map-service
          image: asia-southeast1-docker.pkg.dev/gomirai-prod/gomirai-repo/map-service:latest
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - configMapRef:
                name: gomirai-config
            - secretRef:
                name: gomirai-secrets
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: map-service
  namespace: gomirai
spec:
  selector:
    app: map-service
  ports:
    - port: 8086
      targetPort: 8086
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: map-service-hpa
  namespace: gomirai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: map-service
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
