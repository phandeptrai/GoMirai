apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-service
  namespace: gomirai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: communication-service
  template:
    metadata:
      labels:
        app: communication-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: communication-service
          image: asia-southeast1-docker.pkg.dev/gomirai-prod/gomirai-repo/communication-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: gomirai-config
            - secretRef:
                name: gomirai-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx384m -XX:+UseG1GC"
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "350m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: communication-service
  namespace: gomirai
spec:
  selector:
    app: communication-service
  ports:
    - port: 8085
      targetPort: 8090
