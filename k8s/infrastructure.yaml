# ─────────────────────────────────────────────────────────────────────────────
# KAFKA — StatefulSet (FIXED cho Kubernetes)
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: gomirai
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: broker
          env:
            - name: KAFKA_BROKER_ID
              value: "1"

            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-service:2181"

            # ✅ Lắng nghe trên tất cả interface
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"

            # ✅ Advertise đúng DNS của StatefulSet pod
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-headless.gomirai.svc.cluster.local:9092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            - name: KAFKA_NUM_PARTITIONS
              value: "10"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "kafka-topics --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "kafka-topics --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# Headless service (giữ nguyên nhưng chỉ cần 9092)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092

---
# ClusterIP service cho microservices
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: gomirai
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
