# Infrastructure: Consul (discovery), Zookeeper, Kafka, Redis.
# MongoDB now in separate file k8s/mongodb.yaml
---
# CONSUL
apiVersion: v1
kind: Service
metadata:
  name: consul-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: consul
  ports:
    - port: 8500
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: consul-service
  namespace: gomirai
spec:
  selector:
    app: consul
  ports:
    - port: 8500
      targetPort: 8500
      name: http
---
# CONSUL STATEFULSET
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: gomirai
  labels:
    app: consul
spec:
  serviceName: consul-headless
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.17
          ports:
            - containerPort: 8500
              name: http
          command: ["consul", "agent", "-server", "-ui", "-bootstrap-expect=1", "-client=0.0.0.0", "-data-dir=/consul/data", "-bind=0.0.0.0"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: consul-data
              mountPath: /consul/data
  volumeClaimTemplates:
    - metadata:
        name: consul-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gomirai-zonal-balanced"
        resources:
          requests:
            storage: 3Gi
---
# ZOOKEEPER
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - port: 2181
      name: client
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: gomirai
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
      name: zookeeper
---
# ZOOKEEPER STATEFULSET
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: gomirai
spec:
  serviceName: zookeeper-headless
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gomirai-zonal-balanced"
        resources:
          requests:
            storage: 3Gi
---
# KAFKA
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      name: server
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: gomirai
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
---
# KAFKA STATEFULSET
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: gomirai
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-service:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-headless.gomirai.svc.cluster.local:29092,PLAINTEXT_HOST://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "400m"
            limits:
              memory: "3Gi"
              cpu: "1200m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gomirai-zonal-balanced"
        resources:
          requests:
            storage: 8Gi
---
# REDIS
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: gomirai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
# REDIS STATEFULSET
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: gomirai
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gomirai-zonal-balanced"
        resources:
          requests:
            storage: 4Gi
