# Infrastructure: Consul (discovery), Zookeeper, Kafka, Redis.
# Services register pod IP with Consul; peers resolve via discovery. Consul = StatefulSet + PVC.

# ─────────────────────────────────────────────────────────────────────────────
# CONSUL — StatefulSet (thay Deployment để giữ data qua pod restart)
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: gomirai
  labels:
    app: consul
spec:
  serviceName: consul-headless # ← headless service cho stable DNS: consul-0.consul-headless
  replicas: 3 # Chế độ High Availability (HA)
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: consul
          image: hashicorp/consul:1.17
          ports:
            - containerPort: 8500
              name: http
            - containerPort: 8600
              name: dns
              protocol: UDP
            - containerPort: 8300
              name: server
            - containerPort: 8301
              name: serf-lan
          command:
            - consul
            - agent
            - -server
            - -ui
            - -bootstrap-expect=3
            - -client=0.0.0.0
            - -data-dir=/consul/data
            - -bind=0.0.0.0
            - -advertise=$(POD_IP)
            - -retry-join=consul-0.consul-headless.gomirai.svc.cluster.local
            - -retry-join=consul-1.consul-headless.gomirai.svc.cluster.local
            - -retry-join=consul-2.consul-headless.gomirai.svc.cluster.local
          env:
            - name: CONSUL_LOG_LEVEL
              value: "warn"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["consul", "members"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["consul", "members"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: consul-data
              mountPath: /consul/data
  # PVC template — tự động tạo PersistentVolumeClaim cho mỗi replica
  volumeClaimTemplates:
    - metadata:
        name: consul-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # GKE tự chọn storage class (standard-rwo)
        resources:
          requests:
            storage: 1Gi

---
# Headless Service — để StatefulSet pod có stable DNS
# consul-0.consul-headless.gomirai.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: consul-headless
  namespace: gomirai
spec:
  clusterIP: None # ← headless
  selector:
    app: consul
  ports:
    - name: http
      port: 8500
      targetPort: 8500
    - name: server
      port: 8300
      targetPort: 8300
    - name: serf-lan-tcp
      port: 8301
      targetPort: 8301
    - name: serf-lan-udp
      port: 8301
      targetPort: 8301
      protocol: UDP

---
# ClusterIP Service — cho microservices kết nối Consul qua DNS "consul-service:8500"
# (ConfigMap: SPRING_CLOUD_CONSUL_HOST=consul-service)
apiVersion: v1
kind: Service
metadata:
  name: consul-service
  namespace: gomirai
spec:
  selector:
    app: consul
  ports:
    - name: http
      port: 8500
      targetPort: 8500
    - name: dns
      port: 8600
      targetPort: 8600
      protocol: UDP


# ─────────────────────────────────────────────────────────────────────────────
# ZOOKEEPER — required by Kafka
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: gomirai
  labels:
    app: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
              name: client
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_DATA_DIR
              value: /var/lib/zookeeper/data
            - name: ZOOKEEPER_LOG_DIR
              value: /var/lib/zookeeper/log
            # ✅ Enable 'ruok' four-letter command (disabled by default in cp-zookeeper)
            - name: ZOOKEEPER_4LW_COMMANDS_WHITELIST
              value: "srvr,ruok"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            # Use TCP socket check — reliable, no dependency on nc or 4lw whitelist
            tcpSocket:
              port: 2181
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: gomirai
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
      name: client


# ─────────────────────────────────────────────────────────────────────────────
# KAFKA — StatefulSet với PVC
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: gomirai
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      # ─── Wait for Zookeeper to be ready before Kafka starts ───────────────────
      # This eliminates the race condition where Kafka's preflight check fails
      # because Zookeeper hasn't finished starting yet.
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Zookeeper at zookeeper-service:2181..."
              until nc -z zookeeper-service 2181; do
                echo "Zookeeper not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "Zookeeper is ready!"
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: external
            - containerPort: 29092
              name: internal
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              # ✅ Trỏ đến K8s Service của Zookeeper
              value: "zookeeper-service:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              # ✅ PLAINTEXT (29092): inter-broker & pod-to-pod via headless DNS
              # ✅ PLAINTEXT_HOST (9092): external/client access via kafka-service ClusterIP
              value: "PLAINTEXT://kafka-0.kafka-headless.gomirai.svc.cluster.local:29092,PLAINTEXT_HOST://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true" # Giữ true cho dev, nhưng đặt default partition = 10
            - name: KAFKA_NUM_PARTITIONS
              value: "10" # ≥ maxReplicas(booking=10) để tất cả pods consume song song
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1" # Single broker nên chỉ có replication factor = 1
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824" # 1GB
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: gomirai
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092

---
# ✅ ClusterIP Service — microservices kết nối Kafka qua kafka-service:29092
# ConfigMap: SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-service:9092
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: gomirai
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092


# ─────────────────────────────────────────────────────────────────────────────
# REDIS — TrackingService (geo / cache); tương đương container redis trong Docker
# DNS trong cluster: redis-service:6379
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gomirai
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          args:
            - redis-server
            - --appendonly
            - "yes"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gomirai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
