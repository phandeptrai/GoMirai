# =============================================================================
# GoMirai Staging - Resource Quota (Cost & Safety Protection)
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: gomirai-staging
spec:
  hard:
    # Tổng giới hạn CPU và Memory cho tất cả Pods trong staging
    # Giới hạn thấp để tiết kiệm tài nguyên trên 1 cụm dùng chung
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"

    # Giới hạn số lượng đối tượng
    pods: "20"
    services: "15"
    persistentvolumeclaims: "10"
    configmaps: "10"
    secrets: "15"
---
# =============================================================================
# Lưu ý quan trọng cho DevOps:
# Luôn đặt requests/limits cho mọi microservice để tránh "pod hàng xóm ồn ào"
# =============================================================================
# requests: Cpu 200m / Mem 256Mi (Cho phép pod khởi động & chạy ổn định)
# limits: Cpu 500m / Mem 512Mi   (Chặn pod tiêu thụ quá mức khi gặp lỗi)
