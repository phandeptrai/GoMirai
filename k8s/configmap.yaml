apiVersion: v1
kind: ConfigMap
metadata:
  name: gomirai-config
  namespace: gomirai
data:
  # ── Infrastructure ────────────────────────────────────────────────────────
  SPRING_CLOUD_CONSUL_HOST: "consul-service.gomirai.svc.cluster.local"
  SPRING_CLOUD_CONSUL_PORT: "8500"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service.gomirai.svc.cluster.local:9092"
  SPRING_DATA_REDIS_HOST: "redis-service.gomirai.svc.cluster.local"

  # ── Spring Profile ─────────────────────────────────────────────────────────
  # Đổi sang "prod" — loại bỏ dev log level, dev-only beans
  SPRING_PROFILES_ACTIVE: "prod"

  # ── CORS — Production domains ──────────────────────────────────────────────
  # ⚠️  THAY "your-domain.com" BẰNG DOMAIN THỰC CỦA BẠN
  # Ví dụ: https://gomirai.io,https://www.gomirai.io
  # ApiGateway dùng giá trị này cho phép frontend gọi vào
  CORS_ALLOWED_ORIGINS: "https://your-domain.com,https://www.your-domain.com"

  # ── VNPay — Production callback URL ───────────────────────────────────────
  # ⚠️  THAY bằng domain production thực
  VNPAY_RETURN_URL: "https://your-domain.com/payment/vnpay/result"
  VNPAY_PAYMENT_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"

  # ── PERFORMANCE TUNING ─────────────────────────────────────────────────────
  # Set BCrypt strength to 8 for speed. In production, 10-12 is recommended.
  SECURITY_PASSWORD_BCRYPT_STRENGTH: "8"
  # Default connection pool size for MongoDB across services
  SPRING_DATA_MONGODB_MAX_CONNECTION_POOL_SIZE: "100"
