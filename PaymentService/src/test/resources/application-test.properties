# =============================================================================
# PaymentService - Test Profile (CI/CD)
# =============================================================================

# MongoDB - CI service container
spring.data.mongodb.uri=mongodb://localhost:27017/payment_test_db

# Kafka - CI service container
spring.kafka.bootstrap-servers=localhost:9092

# Consul - Disable for testing
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.config.enabled=false

# JWT - Test secret
security.jwt.secret=test-jwt-secret-for-ci-pipeline-do-not-use-in-production-1234567890

# VNPay - Dummy values for test
vnpay.tmn-code=TEST_TMN_CODE
vnpay.hash-secret=TEST_HASH_SECRET
vnpay.return-url=http://localhost:3000/payment/vnpay/result
