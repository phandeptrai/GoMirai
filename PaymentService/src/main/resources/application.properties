spring.application.name=PaymentService
server.port=8083

# MongoDB Configuration - Sử dụng database riêng cho thanh toán
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=payment_db
spring.data.mongodb.auto-index-creation=true

# Consul - Service Discovery & Registration (chuẩn GoMirai)
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka Configuration (Lắng nghe sự kiện tạo User để tạo Ví)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1

# Cập nhật Consumer Group ID cho Payment
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

# 1. Sử dụng ErrorHandlingDeserializer làm lớp bọc bên ngoài
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# 2. Cấu hình Deserializer thực sự nằm bên trong (Delegate)
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# 3. Ép kiểu dữ liệu đích khi Header bị thiếu hoặc sai lệch package [QUAN TRỌNG]
spring.kafka.consumer.properties.spring.json.value.default.type=com.gomirai.common.dto.event.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.*

# 4. Tắt header type để tránh xung đột package giữa AuthService và PaymentService
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# SECURITY KAFKA: Trust các package chứa sự kiện User và Booking
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.payment,com.gomirai.common.dto.event,com.gomirai.user.events,com.gomirai.booking.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.gomirai.common.dto.event.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.*

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true

# Kafka Topics định nghĩa cho Payment
kafka.topic.user-created=user-created
kafka.topic.payment-completed=payment-completed-event

# CORS - Chỉ cho phép ApiGateway gọi từ bên ngoài
cors.allowed.origins=http://localhost:8080,http://api-gateway:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type,X-Request-ID
cors.allow.credentials=true
cors.max.age=3600

# Actuator - Bảo mật tối đa, chỉ expose health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true

# JWT Secret - Chung toàn hệ thống để giải mã token
security.jwt.secret=${SECURITY_JWT_SECRET}

# Logging (Cập nhật cho PaymentService)
logging.level.com.gomirai.payment=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG 
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.security=DEBUG 
logging.level.org.springframework.web.filter.OncePerRequestFilter=DEBUG 

# Spring Boot optimizations
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false

# Server Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom Payment Properties
payment.currency.default=VND
payment.wallet.initial-balance=0