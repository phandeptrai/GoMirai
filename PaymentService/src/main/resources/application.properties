spring.application.name=PaymentService
server.port=8083

# MongoDB Configuration - Sử dụng database riêng cho thanh toán
spring.data.mongodb.uri=${PAYMENT_MONGODB_URI}
spring.data.mongodb.database=payment_db
spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool — Atlas M0 limit: 500 connections total
# PaymentService: maxReplicas=5 → 5 pods × max(5) = 25 connections  ✅
spring.data.mongodb.max-connection-pool-size=5
spring.data.mongodb.min-connection-pool-size=1
spring.data.mongodb.max-connection-idle-time=60000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=5000

# Consul - Service Discovery & Registration (chuẩn GoMirai)
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.health-check-critical-timeout=30s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka Configuration (Lắng nghe sự kiện tạo User để tạo Ví và Refund)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1

# Cập nhật Consumer Group ID cho Payment
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
# ⚠⚠ Payment CRITICAL: tắt auto-commit tránh duplicate charge
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=AFTER_SYNC_COMMIT
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.heartbeat.interval.ms=15000

# Sử dụng ErrorHandlingDeserializer làm lớp bọc bên ngoài
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Cấu hình Deserializer thực sự nằm bên trong (Delegate)
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust tất cả packages gomirai để deserialize nhiều loại event
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.*

# BẬT type headers để Kafka biết deserialize đúng loại event (RefundRequestedEvent, UserRegisteredEvent, etc.)
spring.kafka.consumer.properties.spring.json.use.type.headers=true

# Kafka Topics định nghĩa cho Payment
kafka.topic.user-created=user-created
kafka.topic.payment-completed=payment-completed-event
kafka.topic.booking-completed=booking-completed-event
kafka.topic.refund-requested=refund.requested

# CORS - Production: được set qua K8s ConfigMap CORS_ALLOWED_ORIGINS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type,X-Request-ID
cors.allow.credentials=true
cors.max.age=3600

# Actuator - Bảo mật tối đa, chỉ expose health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true

# JWT Secret - Chung toàn hệ thống để giải mã token
security.jwt.secret=${SECURITY_JWT_SECRET}

# Logging - INFO cho production
logging.level.com.gomirai.payment=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter.OncePerRequestFilter=INFO

# Spring Boot optimizations
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false

# Server Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom Payment Properties
payment.currency.default=VND
payment.wallet.initial-balance=0

# =============================================================================
# VNPay Configuration
# =============================================================================
# Đăng ký tài khoản merchant tại: https://sandbox.vnpayment.vn/
# Lấy thông tin TMN_CODE và HASH_SECRET từ portal VNPay
# =============================================================================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}

# VNPay Payment URL
# - Sandbox: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# - Production: https://pay.vnpay.vn/vpcpay.html
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

# VNPay Return URL
# ⚠️  Production: VNPAY_RETURN_URL được set trong K8s ConfigMap với production domain
# KHÔNG để fallback localhost — nếu thiếu env var sẽ thất bại rõ ràng
vnpay.return-url=${VNPAY_RETURN_URL}

# VNPay settings
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.expire-minutes=15