# =============================================================================
# Pricing Service - Application Configuration (GoMirai Standard)
# =============================================================================
spring.application.name=PricingService
server.port=8087

# MongoDB Configuration
spring.data.mongodb.uri=${PRICING_MONGODB_URI}
spring.data.mongodb.database=pricing_db
spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool (optimized for MongoDB Atlas)
spring.data.mongodb.max-connection-pool-size=5
spring.data.mongodb.min-connection-pool-size=1
spring.data.mongodb.max-connection-idle-time=60000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=5000

# Consul - Service Discovery & Registration (chuẩn GoMirai)
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.health-check-critical-timeout=30s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka Configuration (đúng chuẩn như UserService, AuthService)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1

spring.kafka.consumer.group-id=pricing-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# SECURITY: Chỉ trust package của chính nó + common events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.pricing,com.gomirai.common.dto.event,com.gomirai.booking.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true

# Kafka Topics định nghĩa sẵn (dùng sau này)
kafka.topic.pricing-rule-changed=pricing-rule-changed-event
kafka.topic.pricing-calculated=pricing-calculated-event
kafka.topic.saga-compensation=saga-compensation-event

# CORS - Production: được set qua K8s ConfigMap CORS_ALLOWED_ORIGINS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type,X-Request-ID
cors.allow.credentials=true
cors.max.age=3600

# Actuator - Bảo mật tối đa, chỉ expose health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true

# JWT Secret - Chung toàn hệ thống
security.jwt.secret=${SECURITY_JWT_SECRET}

# Logging - INFO cho production
logging.level.com.gomirai.pricing=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter.OncePerRequestFilter=INFO

# Spring Boot optimizations
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom Pricing Service properties (tùy chọn mở rộng sau)
pricing.surge.enabled=true
pricing.surge.check-time-window-minutes=30
pricing.cheat-detection.enabled=true
