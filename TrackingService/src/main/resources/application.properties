spring.application.name=tracking-service
server.port=8085

# ==========================================
# 1. Consul Configuration
# ==========================================
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=30s
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
# ✅ K8s: đăng ký pod IP — bắt buộc cho Consul trong K8s
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.deregister=true

# ==========================================
# 2. Redis Configuration (For Geo & Caching)
# ==========================================
spring.data.redis.url=${SPRING_REDIS_URL:}
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.username=${SPRING_REDIS_USERNAME:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2000

spring.threads.virtual.enabled=true

# ── Lettuce Connection Pool ──────────────────────────────────────────────────────
# FIX: Giảm max-active 300 -> 30 để tránh giữ quá nhiều Redis connections.
# 2-3 replicas × 30 = 60-90 connections tổng. Tracking dùng Redis rất nhiều (geo ops) nhưng
# mỗi op chỉ giữ <1ms — pipeline/multiplexing khiến 30 là đủ cho hầu hết workloads.
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=30
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=500ms
# Timeout và reconnect
spring.data.redis.lettuce.shutdown-timeout=100ms

# ── Feign Client Timeouts ──────────────────────────────────────────────────────
# Tránh treo luồng 21s nếu driver-service phản hồi chậm
feign.client.config.default.connect-timeout=2000
feign.client.config.default.read-timeout=5000
feign.client.config.driver-service.read-timeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true

# ==========================================
# 3. Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=tracking-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.common.dto.event,com.gomirai.booking.event,com.gomirai.tracking.event,com.gomirai.driver.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.session.timeout.ms=90000
# Consumer max.poll.interval: separate from HTTP SLA (allows long idle between polls).
spring.kafka.consumer.properties.max.poll.interval.ms=600000
spring.kafka.consumer.properties.heartbeat.interval.ms=20000

# Kafka Topics
kafka.topic.driver-availability-changed=driver-availability-changed
kafka.topic.booking-search-drivers=booking.search_drivers
kafka.topic.driver-booking-offer=driver.booking.offer
kafka.topic.driver-booking-offer-batch=driver.booking.offer.batch
kafka.topic.booking-canceled=booking-canceled-event
kafka.topic.booking-assigned=booking.assigned

# ==========================================
# 4. Security & JWT
# ==========================================
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-ttl-ms=3600000

# Internal API Key - dùng khi TrackingService gọi sang BookingService
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}

# ==========================================
# 5. Actuator
# ==========================================
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always

# ==========================================
# 6. CORS Configuration
# ==========================================
# CORS Configuration
# Production: CORS_ALLOWED_ORIGINS được set qua K8s ConfigMap
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization
cors.allow.credentials=true
cors.max.age=3600

# ==========================================
# 7. Scheduled Cleanup Configuration
# ==========================================
# Increased from 120000 to 300000: at idle geo-set is sparse, cleanup can run less frequently
tracking.cleanup.interval.ms=300000

# ==========================================
# 8. Booking Search Configuration
# ==========================================
booking.search.initial-radius-meters=2000
booking.search.radius-expansion-factor=2.0
booking.search.max-radius-meters=10000
booking.search.expand-interval-minutes=3
booking.search.max-duration-minutes=10
# Increased from 60000 to 120000: scheduler short-circuits immediately when active-set is empty
booking.search.check-interval-ms=120000
booking.service.url=http://BookingService

tracking.rest-template.connect-timeout-ms=2000
tracking.rest-template.read-timeout-ms=5000
spring.mvc.async.request-timeout=5000

# Resilience4j Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.circuitbreaker.instances.bookingService.base-config=default

# Retry Configuration
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.retry.configs.default.enable-exponential-backoff=true

resilience4j.retry.instances.bookingService.base-config=default

resilience4j.bulkhead.instances.trackingRestApi.max-concurrent-calls=100
resilience4j.bulkhead.instances.trackingRestApi.max-wait-duration=0
resilience4j.metrics.enabled=true

# Micrometer Tracing (traceId/spanId trong log vẫn có; chỉ tắt gửi span ra ngoài)
management.tracing.sampling.probability=1.0
# Spring Boot 3.5+: Zipkin dùng management.zipkin.tracing.* (property management.tracing.export.zipkin.* không tắt HttpSender).
# Bật Zipkin: MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED=true (hoặc MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED) + endpoint tương ứng.
management.zipkin.tracing.export.enabled=${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED:false}}
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
server.tomcat.threads.max=400
# Kafka Reliability
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL

# Deep Health Checks
management.health.mongo.enabled=true
management.health.kafka.enabled=true
management.health.consul.enabled=true
management.endpoint.health.show-details=always
