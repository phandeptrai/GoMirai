spring.application.name=TrackingService
server.port=8084

# ==========================================
# 1. Consul Configuration
# ==========================================
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}

# ==========================================
# 2. Redis Configuration (For Geo & Caching)
# ==========================================
# Option 1: Use Redis URI (for cloud Redis - Redis Cloud, Upstash, AWS ElastiCache, etc.)
# Format: redis://username:password@host:port or rediss://username:password@host:port (SSL)
# Example: redis://default:password@redis-12345.c1.us-east-1-1.ec2.cloud.redislabs.com:12345
# Example: rediss://default:password@redis-12345.upstash.io:6379
spring.data.redis.url=${SPRING_REDIS_URL:}

# Option 2: Use host/port (for local Redis or if URI not provided)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.username=${SPRING_REDIS_USERNAME:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}

# ==========================================
# 3. Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=tracking-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.common.dto.event,com.gomirai.booking.event,com.gomirai.tracking.event,com.gomirai.driver.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Topics
kafka.topic.driver-availability-changed=driver-availability-changed
kafka.topic.booking-search-drivers=booking.search_drivers
kafka.topic.driver-booking-offer=driver.booking.offer

# ==========================================
# 4. Security & JWT
# ==========================================
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-ttl-ms=3600000

# ==========================================
# 5. Actuator
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ==========================================
# 6. CORS Configuration
# ==========================================
cors.allowed.origins=http://localhost:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization
cors.allow.credentials=true
cors.max.age=3600

# ==========================================
# 7. Scheduled Cleanup Configuration
# ==========================================
# Interval for cleaning up expired Geo Points (in milliseconds)
# Default: 120000 (2 minutes)
# This task removes Geo Points whose metadata has expired (TTL = 5 minutes)
tracking.cleanup.interval.ms=120000

# ==========================================
# 8. Booking Search Configuration
# ==========================================
# Initial search radius in meters
booking.search.initial-radius-meters=2000
# Radius expansion factor when no drivers found
booking.search.radius-expansion-factor=2.0
# Maximum search radius in meters
booking.search.max-radius-meters=10000
# Interval to expand search radius (in minutes)
booking.search.expand-interval-minutes=5
# Maximum duration to search for drivers (in minutes) - after this, booking will be cancelled
booking.search.max-duration-minutes=15
# Interval to check for pending bookings (in milliseconds)
booking.search.check-interval-ms=60000
# Booking service URL for cancellation
booking.service.url=http://BookingService
