spring.application.name=auth-service
server.port=8081

# Java 21 — giảm đuôi trễ khi nhiều request blocking (BCrypt, I/O) cùng lúc
spring.threads.virtual.enabled=true

# MongoDB Configuration - Default for local, override by Docker env vars
spring.data.mongodb.uri=${AUTH_MONGODB_URI}
spring.data.mongodb.database=auth_db

# MongoDB Connection Pool (optimized for MongoDB Atlas)
spring.data.mongodb.max-connection-pool-size=20
spring.data.mongodb.min-connection-pool-size=1
spring.data.mongodb.max-connection-idle-time=30000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=5000

# Consul Configuration - Default for local, override by Docker env vars
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=30s
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
# ✅ K8s: đăng ký pod IP (không phải hostname) — bắt buộc cho Consul trong K8s
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka Configuration - Default for local, override by Docker env vars
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# ✅ SECURITY: Whitelist only specific packages instead of "*"
# Include common-lib events package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.auth.events,com.gomirai.auth.dto,com.gomirai.common.dto.event
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Topics
kafka.topic.user-created=user-created-event
kafka.topic.user-auth-failed=user-auth-failed-event
kafka.topic.saga-compensation=saga-compensation-event
kafka.topic.user-registered=user-registered

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-ttl-ms=${SECURITY_JWT_TTL_MS:3600000}
# BCrypt cost (4–31). 10 = mặc định an toàn; verify ~200–400ms/CPU. Dev/load-test: có thể set SECURITY_PASSWORD_BCRYPT_STRENGTH=8 (nhanh hơn ~4×, yếu hơn).
security.password.bcrypt-strength=${SECURITY_PASSWORD_BCRYPT_STRENGTH:8}

# CORS Configuration - AuthService chỉ cho phép ApiGateway
# Production: CORS_ALLOWED_ORIGINS được set qua K8s ConfigMap
# Nội bộ: chỉ ApiGateway được gọi service này
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization
cors.allow.credentials=true
cors.max.age=3600

# Actuator - CHỈ expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# =============================================================================
# Google OAuth Configuration
# =============================================================================
# Google OAuth performs AUTHENTICATION only (identity verification)
# No distinction between "login" and "register" from user's perspective:
# - If providerUserId (Google sub) exists → treat as login
# - If not exists → auto-registration, emitting events to UserService & PaymentService
# =============================================================================
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}

# Internal API Key - dùng cho giao tiếp nội bộ giữa các microservices
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}

server.tomcat.threads.max=400
# Resilience4j Standard Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
# Kafka Reliability
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL

# Deep Health Checks
management.health.mongo.enabled=true
management.health.kafka.enabled=true
management.health.consul.enabled=true
management.endpoint.health.show-details=always
