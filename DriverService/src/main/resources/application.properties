spring.application.name=DriverService
server.port=8084

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/driver_db}
spring.data.mongodb.database=driver_db

# MongoDB Connection Pool (optimized for MongoDB Atlas)
spring.data.mongodb.max-connection-pool-size=20
spring.data.mongodb.min-connection-pool-size=5
spring.data.mongodb.max-connection-idle-time=60000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=5000

# Consul
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=driver-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.driver.event,com.gomirai.driver,com.gomirai.common.dto.event,com.gomirai.booking.event,com.gomirai.tracking.event
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Topics
kafka.topic.driver-availability-changed=driver-availability-changed
kafka.topic.booking-search-drivers=booking.search_drivers
kafka.topic.driver-accepted=driver.accepted
kafka.topic.driver-booking-offer=driver.booking.offer
kafka.topic.driver-rating-updated=driver.rating.updated

# JWT (common-lib)
security.jwt.secret=${SECURITY_JWT_SECRET:demo-driver-secret-change-me}
security.jwt.access-ttl-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Logging
logging.level.com.gomirai.driver=INFO
logging.level.com.gomirai.common=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO

# Booking Offer Cleanup
booking.offer.cleanup-interval-ms=60000
