spring.application.name=driver-service
server.port=8084

# MongoDB
spring.data.mongodb.uri=${DRIVER_MONGODB_URI}
spring.data.mongodb.database=driver_db
spring.data.mongodb.uuid-representation=standard

# MongoDB Connection Pool (optimized for MongoDB Atlas)
spring.data.mongodb.max-connection-pool-size=20
spring.data.mongodb.min-connection-pool-size=0
spring.data.mongodb.max-connection-idle-time=30000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=2000
spring.data.mongodb.socket-timeout=3000

# Consul
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=30s
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
# ✅ K8s: đăng ký pod IP — bắt buộc cho Consul trong K8s
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.deregister=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=driver-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.remove.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# Applied manually in KafkaConfig (custom listener factory). Empty poll batches wait before next poll — lowers idle CPU vs default 0.
spring.kafka.listener.idle-between-polls=500ms

# Kafka Topics
kafka.topic.driver-availability-changed=driver-availability-changed
kafka.topic.booking-search-drivers=booking.search_drivers
kafka.topic.driver-accepted=driver.accepted
kafka.topic.driver-booking-offer=driver.booking.offer
kafka.topic.driver-booking-offer-batch=driver.booking.offer.batch
kafka.topic.driver-rating-updated=driver.rating.updated

# JWT (common-lib)
# ✅ FIX: Không có fallback — BUỘC phải set SECURITY_JWT_SECRET qua K8s Secret
security.jwt.secret=${SECURITY_JWT_SECRET}
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}
security.jwt.access-ttl-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=true

# Security - Prevent "Generated Security Password" warning
spring.security.user.name=gomirai-admin
spring.security.user.password=gomirai-admin-password

# Logging
logging.level.com.gomirai.driver=INFO
logging.level.com.gomirai.common=INFO
logging.level.org.springframework.security=INFO
# Kafka client/framework at WARN — INFO spams logs on every poll/send under load
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN

# Booking Offer Cleanup
booking.offer.cleanup-interval-ms=60000

# ── CORS ─────────────────────────────────────────────────────────────────────
# ✅ FIX: Production origins được inject từ K8s ConfigMap (CORS_ALLOWED_ORIGINS)
# Local dev fallback: chỉ cho phép ApiGateway
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization
cors.allow.credentials=true
cors.max.age=3600

# ── JWT ──────────────────────────────────────────────────────────────────────
# ✅ FIX: Bỏ fallback "demo-driver-secret-change-me" — buộc phải set env var
# (xem security.jwt.secret dòng trên)
server.tomcat.threads.max=400
spring.mvc.async.request-timeout=5000
driver.rest-template.connect-timeout-ms=2000
driver.rest-template.read-timeout-ms=5000
# ── Feign Client Timeouts ──────────────────────────────────────────────────────
# Tránh treo request khi gọi service khác chậm.
feign.client.config.default.connect-timeout=2000
feign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.bulkhead.instances.driverRestApi.max-concurrent-calls=100
resilience4j.bulkhead.instances.driverRestApi.max-wait-duration=0
resilience4j.metrics.enabled=true
# Resilience4j Standard Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
