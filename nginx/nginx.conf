events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_gateway {
        server api-gateway:8080;
    }

    upstream notification_service {
        server notification-service:8090;
    }

    upstream driver_service {
        server driver-service:8084;
    }

    server {
        listen 80;
        server_name localhost;

        # WebSocket for NotificationService (Customer realtime)
        location /ws {
            proxy_pass http://notification_service;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REMOVED: /ws/driver and /ws/booking routes
        # All WebSocket now goes through /ws to NotificationService

        # REST API → API Gateway
        location / {
            proxy_pass http://api_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
