events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;
        
        # Docker DNS resolver - resolve service names dynamically
        resolver 127.0.0.11 valid=10s;

        # WebSocket for NotificationService (Customer realtime)
        location /ws {
            # Use variable to force DNS re-resolution on each request
            set $notification_backend "http://notification-service:8090";
            proxy_pass $notification_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API → API Gateway
        location / {
            set $api_gateway_backend "http://api-gateway:8080";
            proxy_pass $api_gateway_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
