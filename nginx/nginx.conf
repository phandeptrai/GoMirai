events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format to track which backend handled the request
    log_format upstreamlog '[$time_local] $remote_addr - $request - '
                          'Backend: $upstream_addr - Status: $status - '
                          'Response Time: $upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;

    # Docker DNS resolver - resolve service names dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============================================
    # UPSTREAM DEFINITIONS for Load Balancing
    # ============================================
    
    # API Gateway upstream (3 instances)
    # Using variable to force dynamic DNS resolution
    # upstream api_gateway_backend {
    #     least_conn;
    #     server api-gateway:8080 max_fails=3 fail_timeout=30s;
    # }

    # Notification Service upstream (3 instances) 
    # Using variable to force dynamic DNS resolution
    # upstream notification_backend {
    #     least_conn;
    #     server notification-service:8090 max_fails=3 fail_timeout=30s;
    #     # For WebSocket, use ip_hash for sticky sessions
    #     # ip_hash;
    # }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy nginx\n";
            add_header Content-Type text/plain;
        }

        # WebSocket for NotificationService
        # Note: For load balancing across 3 instances, Docker DNS will round-robin
        location /ws {
            # Dynamic DNS resolution for load balancing
            set $notification_backend "notification-service:8090";
            proxy_pass http://$notification_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Enable buffering control
            proxy_buffering off;
        }

        # REST API → API Gateway (Load Balanced)
        location / {
            # Dynamic DNS resolution - Docker DNS will round-robin between 3 instances
            set $api_gateway_backend "api-gateway:8080";
            proxy_pass http://$api_gateway_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Forward Authorization header (JWT token)
            proxy_set_header Authorization $http_authorization;

            # Connection keep-alive
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Retry logic - try next backend on error
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Nginx status for monitoring
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }
    }
}
