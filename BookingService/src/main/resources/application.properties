# =============================================================================
# Booking Service - Application Configuration (GoMirai Standard)
# =============================================================================
spring.application.name=booking-service
server.port=8088

# MongoDB Configuration
spring.data.mongodb.uri=${BOOKING_MONGODB_URI}
spring.data.mongodb.database=booking_db
spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool (optimized for MongoDB Atlas)
spring.data.mongodb.max-connection-pool-size=20
# Set to 0 so idle connections are closed rather than held open permanently
spring.data.mongodb.min-connection-pool-size=0
spring.data.mongodb.max-connection-idle-time=30000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=5000

# Consul - Service Discovery & Registration (chuẩn GoMirai)
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:consul}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=30s
# Consul đánh dấu pod là CRITICAL nếu health check fail liên tiếp trong 90s
# → Increased from 30s to give services more time before being marked critical
spring.cloud.consul.discovery.health-check-critical-timeout=90s
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}
spring.cloud.consul.discovery.prefer-ip-address=true

# Kafka Configuration (đúng chuẩn như UserService, AuthService)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1

spring.kafka.consumer.group-id=booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
# ⚠⚠ Tắt auto-commit → commit thủ công sau khi xử lý xong
# Phòng tránh duplicate message khi rebalance xảy ra lúc scale
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL
# Rebalance tuning: tành rebalance không cần thiết
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.heartbeat.interval.ms=15000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# SECURITY: Chỉ trust package của chính nó + common events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gomirai.booking,com.gomirai.common.dto.event,com.gomirai.payment.events,com.gomirai.pricing.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=true

# Kafka Topics định nghĩa sẵn (dùng sau này)
kafka.topic.booking-created=booking-created-event
kafka.topic.booking-matched=booking-matched-event
kafka.topic.booking-started=booking-started-event
kafka.topic.booking-completed=booking-completed-event
kafka.topic.booking-canceled=booking-canceled-event
kafka.topic.booking-expired=booking-expired-event
kafka.topic.saga-compensation=saga-compensation-event
kafka.topic.booking-search-drivers=booking.search_drivers
kafka.topic.booking-assigned=booking.assigned
kafka.topic.driver-accepted=driver.accepted
kafka.topic.driver-declined=driver.declined
kafka.topic.booking-status-changed=booking.status.changed
kafka.topic.refund-requested=refund.requested

# CORS - Production: được set qua K8s ConfigMap CORS_ALLOWED_ORIGINS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://api-gateway:8080}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type,X-Request-ID
cors.allow.credentials=true
cors.max.age=3600

# Actuator - Bảo mật tối đa, chỉ expose health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true

# JWT Secret - Chung toàn hệ thống
security.jwt.secret=${SECURITY_JWT_SECRET}

# Internal API Key - dùng cho giao tiếp nội bộ giữa các microservices
security.internal.api-key=${INTERNAL_API_KEY:gomirai-internal-s3cr3t-k3y-2026-ch4ng3-m3-1n-pr0ductI0n}

# Logging - INFO cho production; DEBUG chỉ bật khi debug local
logging.level.com.gomirai.booking=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter.OncePerRequestFilter=INFO

# Spring Boot optimizations
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Custom Booking Service properties
booking.expiry-timeout-minutes=2
booking.max-retry-driver-match=3
booking.map-service.timeout=5000
booking.pricing-service.timeout=5000
booking.tracking-service.timeout=5000
booking.rest-template.timeout=5000
booking.driver-search-radius-meters=2000
# Radius for finding nearby bookings for driver (in kilometers)
# Resilience4j Configuration
# Default configurations for all instances
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# Instance specific configurations
resilience4j.circuitbreaker.instances.mapService.base-config=default
resilience4j.circuitbreaker.instances.pricingService.base-config=default
resilience4j.circuitbreaker.instances.paymentService.base-config=default
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=30

# Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2

# Instance specific retry
resilience4j.retry.instances.mapService.base-config=default
resilience4j.retry.instances.pricingService.base-config=default
# NO RETRY for paymentService to avoid double charging without idempotency check (handled in Phase 4)

# Micrometer Tracing
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

server.tomcat.threads.max=400
# Kafka Reliability
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL

# Deep Health Checks
management.health.mongo.enabled=true
management.health.kafka.enabled=true
management.health.consul.enabled=true
management.endpoint.health.show-details=always
